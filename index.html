<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>NexusInvest - شبكة المستثمرين</title>
    <style>
        body { background-color: #030712; color: #f8fafc; font-family: Tahoma, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; text-align: center; padding: 40px 20px; }
        h1 { color: #34d399; font-size: 2.5em; }
        p { color: #94a3b8; font-size: 1.2em; }
        .btn { background-color: #10b981; color: #030712; padding: 15px 30px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; font-size: 1em; margin-top: 20px; }
        .btn:hover { background-color: #059669; }
        .box { background-color: #1e293b; border: 1px solid #334155; padding: 20px; border-radius: 12px; margin-top: 30px; text-align: right; }
        input, textarea, select { width: 100%; padding: 10px; margin: 10px 0; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; box-sizing: border-box; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>NexusInvest</h1>
        <p>منصة تفاعلية لتبادل الخبرات والصفقات بين المستثمرين</p>
        
        <button class="btn" onclick="openModal()">اضغط هنا لتسجيل الدخول التجريبي</button>

        <div id="dashboard" class="box hidden">
            <h2 style="color: #34d399;">لوحة تحكم المستثمر الموثق</h2>
            <p>أهلاً بك، تم فتح المنصة بنجاح!</p>
            
            <hr style="border-color: #334155; margin: 20px 0;">

            <h3>طرح فرصة استثمارية جديدة</h3>
            <input type="text" id="dealTitle" placeholder="عنوان الفرصة (مثال: مشروع تكنولوجي)">
            <textarea id="dealDesc" rows="3" placeholder="تفاصيل الفرصة الاستثمارية..."></textarea>
            <button class="btn" onclick="postDeal()" style="padding: 10px 20px;">نشر في الغرفة</button>

            <div id="dealsList" style="margin-top: 20px;"></div>
        </div>
    </div>

    <!-- النافذة المنسدلة -->
    <div id="myModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); justify-content:center; align-items:center;">
        <div style="background:#1e293b; padding:30px; border-radius:12px; width:90%; max-width:400px; text-align:right; position:relative;">
            <span onclick="closeModal()" style="position:absolute; top:10px; left:15px; cursor:pointer; font-size:24px; color:#94a3b8;">&times;</span>
            <h3 style="color: white; margin-top:0;">تسجيل الدخول للمنصة</h3>
            <input type="text" id="userName" placeholder="اسم المستثمر أو الصندوق">
            <input type="email" placeholder="البريد الإلكتروني المهني">
            <button class="btn" onclick="login()" style="width:100%;">دخول الآن</button>
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById('myModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('myModal').style.display = 'none';
        }

        function login() {
            const name = document.getElementById('userName').value;
            if(!name) {
                alert('المرجو ادخال الاسم!');
                return;
            }
            closeModal();
            document.getElementById('dashboard').classList.remove('hidden');
            alert('مرحباً بك ' + name + '، تم تفعيل لوحة التحكم بنجاح!');
        }

        function postDeal() {
            const title = document.getElementById('dealTitle').value;
            const desc = document.getElementById('dealDesc').value;
            if(!title || !desc) {
                alert('المرجو ملء جميع الحقول!');
                return;
            }

            const list = document.getElementById('dealsList');
            const card = document.createElement('div');
            card.style.cssText = "background:#0f172a; padding:15px; border-radius:8px; margin-top:10px; border-right:4px solid #10b981;";
            card.innerHTML = `<h4 style="margin:0 0 5px 0; color:white;">${title}</h4><p style="margin:0; color:#94a3b8; font-size:0.9em;">${desc}</p>`;
            list.prepend(card);

            document.getElementById('dealTitle').value = '';
            document.getElementById('dealDesc').value = '';
            alert('تم نشر الفرصة بنجاح!');
        }
    </script>
</body>
</html>
